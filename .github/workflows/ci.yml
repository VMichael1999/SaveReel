name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee pruebas.log
      - name: Resumen de fallos
        if: failure()
        run: |
          grep -E "\[E\]|Expected:|Actual:|Which:|EXCEPTION|Exception:" pruebas.log | sort -u | head -9 | while IFS= read -r linea; do
            echo "::error::${linea:0:380}"
          done
