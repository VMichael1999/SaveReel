name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: flutter test --reporter github
